name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist as a git tag.'
        required: true

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  build:
    name: Build & release
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Select latest Xcode (need Swift 6+ for swift-testing)
        run: |
          LATEST=$(ls -1d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Selecting $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG (version: $VERSION)"

      - name: Run tests
        run: swift test

      # arm64-only for v0.1.0. SPM's universal build (--arch arm64 --arch
      # x86_64) currently misencodes .swiftLanguageMode(.v5) when it routes
      # through xcodebuild. Revisit universal once that's fixed or once we
      # adopt Swift 6 language mode end-to-end.
      - name: Build release binary (arm64)
        run: swift build -c release --arch arm64

      - name: Package .app bundle
        run: |
          BIN_DIR=$(swift build -c release --arch arm64 --show-bin-path)
          export BIN_PATH="${BIN_DIR}/CaffeinateMenubar"
          ./scripts/make-app.sh "${{ steps.version.outputs.version }}"

      - name: Verify bundle
        run: |
          file build/CaffeinateMenubar.app/Contents/MacOS/CaffeinateMenubar
          plutil -lint build/CaffeinateMenubar.app/Contents/Info.plist
          lipo -info build/CaffeinateMenubar.app/Contents/MacOS/CaffeinateMenubar || true

      - name: Archive with ditto (preserves bundle metadata)
        run: |
          cd build
          # ditto is Apple's recommended tool for archiving .app bundles —
          # preserves extended attributes, code signatures, and resource forks.
          # zip -ry strips some of those, which can present as "damaged" on
          # download.
          ditto -c -k --sequesterRsrc --keepParent CaffeinateMenubar.app CaffeinateMenubar.zip
          shasum -a 256 CaffeinateMenubar.zip > CaffeinateMenubar.zip.sha256
          ls -lh CaffeinateMenubar.zip CaffeinateMenubar.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            build/CaffeinateMenubar.zip
            build/CaffeinateMenubar.zip.sha256
          body: |
            ## Install

            1. Download `CaffeinateMenubar.zip` below.
            2. Unzip and drag `CaffeinateMenubar.app` into `/Applications`.
            3. **Remove the Gatekeeper quarantine flag.** This release isn't notarized, so macOS would otherwise refuse to open it ("damaged" message). One Terminal command:

               ```
               xattr -dr com.apple.quarantine /Applications/CaffeinateMenubar.app
               ```

               After that the app launches normally on every double-click.
            4. Look for the cup-and-saucer icon in your menubar — click it to start a session.

            ### Alternative (no Terminal)

            Try to open the app, get the "damaged" warning, then go to **System Settings → Privacy & Security**, scroll to the bottom, and click **Open Anyway** next to the CaffeinateMenubar entry. macOS may ask once more — confirm.

            ### Requirements

            macOS 13 (Ventura) or later. Apple Silicon only in this release; Intel users can build from source via `swift build -c release`.

            ### Why all this manual stuff

            Proper signing + notarization (which would remove the quarantine friction entirely) requires a paid Apple Developer ID. That's planned as a follow-up. For now, the app is ad-hoc signed — enough for the binary to be valid on Apple Silicon, but not enough to satisfy Gatekeeper on a fresh download.
