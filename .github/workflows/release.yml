name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist as a git tag.'
        required: true

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  build:
    name: Build & release
    runs-on: macos-14
    environment: prod
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Select latest Xcode (need Swift 6+ for swift-testing)
        run: |
          LATEST=$(ls -1d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Selecting $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG (version: $VERSION)"

      - name: Run tests
        run: swift test

      # arm64-only for v0.1.0. SPM's universal build (--arch arm64 --arch
      # x86_64) currently misencodes .swiftLanguageMode(.v5) when it routes
      # through xcodebuild. Revisit universal once that's fixed or once we
      # adopt Swift 6 language mode end-to-end.
      - name: Build release binary (arm64)
        run: swift build -c release --arch arm64

      - name: Import signing certificate
        id: signing
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          # Allow codesign to use the imported key without an interactive prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" \
            | head -n1 \
            | awk -F'"' '{print $2}')

          if [ -z "$IDENTITY" ]; then
            echo "ERROR: no 'Developer ID Application' identity found in imported keychain" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2 || true
            exit 1
          fi

          echo "Using signing identity: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Package .app bundle (signed with Developer ID)
        env:
          DEVELOPER_ID_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          BIN_DIR=$(swift build -c release --arch arm64 --show-bin-path)
          export BIN_PATH="${BIN_DIR}/CaffeinateMenubar"
          ./scripts/make-app.sh "${{ steps.version.outputs.version }}"

      - name: Verify bundle
        run: |
          file build/CaffeinateMenubar.app/Contents/MacOS/CaffeinateMenubar
          plutil -lint build/CaffeinateMenubar.app/Contents/Info.plist
          lipo -info build/CaffeinateMenubar.app/Contents/MacOS/CaffeinateMenubar || true
          codesign --verify --strict --verbose=2 build/CaffeinateMenubar.app

      - name: Notarize & staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/notarize.sh build/CaffeinateMenubar.app

      - name: Archive with ditto (preserves bundle metadata)
        run: |
          cd build
          # ditto is Apple's recommended tool for archiving .app bundles —
          # preserves extended attributes, code signatures, and the stapled
          # notarization ticket. Must run AFTER stapling.
          ditto -c -k --sequesterRsrc --keepParent CaffeinateMenubar.app CaffeinateMenubar.zip
          shasum -a 256 CaffeinateMenubar.zip > CaffeinateMenubar.zip.sha256
          ls -lh CaffeinateMenubar.zip CaffeinateMenubar.zip.sha256

      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${{ steps.signing.outputs.keychain_path }}" ]; then
            security delete-keychain "${{ steps.signing.outputs.keychain_path }}" || true
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            build/CaffeinateMenubar.zip
            build/CaffeinateMenubar.zip.sha256
          body: |
            ## Install

            ### Homebrew

            ```
            brew tap slastrina/tap
            brew install --cask caffeinatemenubar
            ```

            ### Manual

            1. Download `CaffeinateMenubar.zip` below.
            2. Unzip and drag `CaffeinateMenubar.app` into `/Applications`.
            3. Double-click to launch. Look for the cup-and-saucer icon in your menubar.

            This release is signed with a Developer ID certificate and notarized by Apple, so Gatekeeper should let it open without warnings on a fresh download.

            ### Requirements

            macOS 13 (Ventura) or later. Apple Silicon only in this release; Intel users can build from source via `swift build -c release`.

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$HOMEBREW_TAP_PAT" ]; then
            echo "HOMEBREW_TAP_PAT not set — skipping tap update."
            echo "(Set the secret + create the slastrina/homebrew-tap repo to enable this step.)"
            exit 0
          fi

          SHA=$(shasum -a 256 build/CaffeinateMenubar.zip | awk '{print $1}')
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/slastrina/homebrew-tap.git" \
            "$TAP_DIR"

          mkdir -p "$TAP_DIR/Casks"
          cat > "$TAP_DIR/Casks/caffeinatemenubar.rb" <<EOF
          cask "caffeinatemenubar" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/slastrina/caffeinate-menubar/releases/download/v#{version}/CaffeinateMenubar.zip"
            name "CaffeinateMenubar"
            desc "Menubar app that wraps the macOS caffeinate command"
            homepage "https://github.com/slastrina/caffeinate-menubar"

            depends_on macos: ">= :ventura"

            app "CaffeinateMenubar.app"

            zap trash: [
              "~/Library/Preferences/com.samuellastrina.caffeinatemenubar.plist",
            ]
          end
          EOF

          cd "$TAP_DIR"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Casks/caffeinatemenubar.rb
          if git diff --staged --quiet; then
            echo "Cask already at ${VERSION} — nothing to commit."
            exit 0
          fi
          git commit -m "Bump caffeinatemenubar to ${VERSION}"
          git push
